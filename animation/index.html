<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Four Transform Boxes</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    

    <!-- Main Container -->
    <div class="container">

        <div class="box box1">
            <span>1</span>
            <p>Rotate</p>
        </div>

        <div class="box box2">
            <span>2</span>
            <p>SCALE</p>
        </div>

        <div class="box box3">
            <span>3</span>
            <p>TRANSLATE</p>
        </div>

        <div class="box box4">
            <span>4</span>
            <p>SKEW</p>
        </div>

    </div>

    <!-- Music -->
    <div class="music">
        <audio controls loop>
            <source src="music.mp3" type="audio/mpeg">
           
        </audio>
    </div>

</body>
</html>
