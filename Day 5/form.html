<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Card Form</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="container">
      <div class="card-image">
        <img
          src="https://t3.ftcdn.net/jpg/08/04/61/18/360_F_804611831_NugKnr3uLjHsRyjLy1KTUJ4FevQGFcmz.jpg"
          alt="Card"
        />
      </div>

      <form id="cardForm" class="form-box">
        <div class="field">
          <label for="cardNumber"> Card Number </label>

          <input
            type="text"
            id="cardNumber"
            placeholder="0000 0000 0000 0000"
            maxlength="19"
            required
          />
        </div>

        <div class="field">
          <label for="cardHolder"> Card Holder </label>

          <input type="text" id="cardHolder" placeholder="Full Name" required />
        </div>

        <div class="row">
          <div class="expiration">
            <label> Expiration Date </label>

            <div class="date-fields">
              <select id="month" required>
                <option value="">Month</option>

                <option value="01">01</option>
                <option value="02">02</option>
                <option value="03">03</option>
                <option value="04">04</option>
                <option value="05">05</option>
                <option value="06">06</option>
                <option value="07">07</option>
                <option value="08">08</option>
                <option value="09">09</option>
                <option value="10">10</option>
                <option value="11">11</option>
                <option value="12">12</option>
              </select>

              <select id="year" required>
                <option value="">Year</option>

                <option value="2026">2026</option>
                <option value="2027">2027</option>
                <option value="2028">2028</option>
                <option value="2029">2029</option>
                <option value="2030">2030</option>
              </select>
            </div>
          </div>

          <div class="cvv">
            <label for="cvv"> CVV </label>

            <input type="password" id="cvv" maxlength="4" required />
          </div>
        </div>

        <button type="submit">Submit</button>
      </form>

      <div class="table-box">
        <h2>Submitted Information</h2>

        <table>
          <thead>
            <tr>
              <th>Card Number</th>

              <th>Card Holder</th>

              <th>Expiration</th>
            </tr>
          </thead>

          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
